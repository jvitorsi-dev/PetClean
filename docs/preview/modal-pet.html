<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetClean - Pets (pré-visualização)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../src/main/resources/static/css/menus-globais.css">
    <link rel="stylesheet" href="../../src/main/resources/static/css/perfil.css">
</head>
<body>
<!--
  PRE-VISUALIZACAO ESTATICA (nao e a aplicacao em execucao): markup copiado de
  src/main/resources/templates/paginas/pets.html + CSS real do projeto, com os
  atributos th:* resolvidos a mao e dados de exemplo. Serve para conferir o modal.
-->
<div class="modal-overlay active" id="modal-pet">
        <div class="modal-box">
            <button class="modal-close" id="btn-fechar-modal">✕</button>
            <h2 id="modal-titulo">Editar Pet</h2>
            <form id="form-pet">
                <input type="hidden" id="pet-id" name="id">
                <div class="form-modal-group">
                    <label for="pet-nome">Nome do Pet *</label>
                    <input type="text" id="pet-nome" name="nome" value="Lola" required />
                </div>
                <div class="form-modal-group">
                    <label for="pet-raca">Raça *</label>
                    <input type="text" id="pet-raca" name="raca" value="SRD" placeholder="Ex: Poodle, SRD..." required />
                </div>
                <div class="form-modal-group">
                    <label for="pet-especie">Espécie *</label>
                    <select id="pet-especie" name="especie" style="width: 100%; padding: 10px; border: 1px solid #E5E7EB; border-radius: 8px; outline: none; background: #fff;" required>
                        <option value="">Selecione...</option>
                        <option value="CACHORRO" selected>Cachorro</option>
                        <option value="GATO">Gato</option>
                        <option value="AVE">Ave</option>
                        <option value="ROEDOR">Roedor</option>
                        <option value="REPTIL">Reptil</option>
                        <option value="OUTRO">Outro</option>
                    </select>
                </div>
                <div class="form-modal-group">
                    <label for="pet-porte">Porte *</label>
                    <select id="pet-porte" name="porte" style="width: 100%; padding: 10px; border: 1px solid #E5E7EB; border-radius: 8px; outline: none; background: #fff;" required>
                        <option value="">Selecione...</option>
                        <option value="PEQUENO" selected>Pequeno</option>
                        <option value="MEDIO">Médio</option>
                        <option value="GRANDE">Grande</option>
                    </select>
                </div>
                <div class="form-modal-group">
                    <label for="pet-idade">Idade (Anos) *</label>
                    <input type="number" id="pet-idade" name="idade" value="3" min="0" max="30" required />
                </div>
                <div class="form-modal-group">
                    <label for="pet-cliente">Tutor (Dono) *</label>
                    <select id="pet-cliente" name="cliente_id" style="width: 100%; padding: 10px; border: 1px solid #E5E7EB; border-radius: 8px; outline: none; background: #fff;" required>
                        <option value="">Selecione um tutor...</option>
                        <option value="1" selected>Maria da Silva</option>
                        <option value="2">Carlos Pereira</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancelar-modal" id="btn-cancelar-modal">Cancelar</button>
                    <button type="submit" class="btn-salvar-modal">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
