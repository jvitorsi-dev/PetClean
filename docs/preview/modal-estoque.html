<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetClean - Estoque (pré-visualização)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../src/main/resources/static/css/menus-globais.css">
    <link rel="stylesheet" href="../../src/main/resources/static/css/perfil.css">
</head>
<body>
<!--
  PRE-VISUALIZACAO ESTATICA (nao e a aplicacao em execucao): markup copiado de
  src/main/resources/templates/paginas/estoque.html + CSS real do projeto, com os
  atributos th:* resolvidos a mao e dados de exemplo. Serve para conferir o modal.
-->
<div class="modal-overlay active" id="modal-produto">
        <div class="modal-box">
            <button class="modal-close" id="btn-fechar-modal">✕</button>
            <h2 id="modal-titulo">Editar Produto</h2>
            <form id="form-produto">
                <input type="hidden" id="produto-id" name="id">
                <div class="form-modal-group">
                    <label for="prod-nome">Nome do Produto *</label>
                    <input type="text" id="prod-nome" name="nome" value="Shampoo Neutro 500ml" required />
                </div>
                <div class="form-modal-group">
                    <label for="prod-categoria">Categoria *</label>
                    <select id="prod-categoria" name="categoria" style="width: 100%; padding: 10px; border: 1px solid #E5E7EB; border-radius: 8px; outline: none; background: #fff;" required>
                        <option value="">Selecione...</option>
                        <option value="RACAO">Ração</option>
                        <option value="MEDICAMENTO">Medicamento</option>
                        <option value="HIGIENE" selected>Higiene</option>
                        <option value="BRINQUEDO">Brinquedo</option>
                        <option value="ACESSORIO">Acessório</option>
                        <option value="OUTRO">Outro</option>
                    </select>
                </div>
                <div class="form-modal-group">
                    <label for="prod-quantidade">Quantidade Atual *</label>
                    <input type="number" id="prod-quantidade" name="quantidade" value="12" min="0" required />
                </div>
                <div class="form-modal-group">
                    <label for="prod-minimo">Estoque Mínimo de Alerta *</label>
                    <input type="number" id="prod-minimo" name="estoque_minimo" value="3" min="0" required />
                </div>
                <div class="form-modal-group">
                    <label for="prod-preco">Preço de Venda (R$) *</label>
                    <input type="number" id="prod-preco" name="preco_venda" value="39.90" step="0.01" min="0.00" placeholder="0.00"
                        required />
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancelar-modal" id="btn-cancelar-modal">Cancelar</button>
                    <button type="submit" class="btn-salvar-modal">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
