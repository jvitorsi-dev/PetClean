<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solicitar Trial Gratuito - PetClean</title>
  <link rel="stylesheet" href="../css/solicitar-demo.css" />
</head>
<body>

  <header class="topo">
    <div class="logo">
      <img src="../assets/logo.png" alt="Logotipo PetClean">
    </div>
    <nav class="menu">
      <a href="inicio.html">Início</a>
      <a href="sobrenos.html">Sobre Nós</a>
      <a href="funcionalidades.html">Funcionalidades</a>
      <a href="faleconosco.html">Fale Conosco</a>
    </nav>
  </header>

  <div class="solicitar-demo">
    <img class="header-bg" src="../assets/ret_verde.png" alt="Fundo decorativo verde">

    <div class="titulo-area">
      <h1>Solicitar Trial Gratuito - PetClean</h1>
      <p>Teste grátis por 14/30 dias. Gerencie seu pet shop com mais organization e eficiência.</p>
    </div>

    <div class="form-container">
      <form class="form" id="form-solicitar-demo">
        <div class="campo">
          <label for="nome">Nome Completo *</label>
          <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
        </div>

        <div class="campo">
          <label for="petshop">Nome do Petshop *</label>
          <input type="text" id="petshop" name="nome_petshop" placeholder="Nome do Petshop" required>
        </div>

        <div class="campo">
          <label for="estado">Estado *</label>
          <select id="estado" name="estado" required>
            <option value="" disabled selected>Estado em que o Petshop se encontra</option>
            <option value="SP">São Paulo</option>
            <option value="RJ">Rio de Janeiro</option>
            <option value="MG">Minas Gerais</option>
            <option value="RS">Rio Grande do Sul</option>
            <option value="PR">Paraná</option>
          </select>
        </div>

        <div class="campo">
          <label for="email">E-mail *</label>
          <input type="email" id="email" name="email" placeholder="seu@email.com" required>
        </div>

        <div class="campo">
          <label for="telefone">Telefone</label>
          <input type="text" id="telefone" name="telefone" placeholder="(11) 98765-4321">
        </div>

        <div class="campo">
          <label for="tamanho">Tamanho do Petshop *</label>
          <select id="tamanho" name="tamanho" required>
            <option value="" disabled selected>Selecione o Tamanho do Petshop</option>
            <option value="pequeno">Pequeno</option>
            <option value="medio">Médio</option>
            <option value="grande">Grande</option>
          </select>
        </div>

        <div class="campo">
          <label for="atendimentos">Quantidade Média de Atendimentos *</label>
          <input type="number" id="atendimentos" name="atendimentos" placeholder="Digite a Quantidade de Atendimentos" required>
        </div>

        <div class="campo">
          <label for="necessidades">Principais Necessidades</label>
          <input type="text" id="necessidades" name="necessidades" placeholder="Digite as Principais Necessidades">
        </div>

        <div class="campo">
          <label for="mensagem">Mensagem *</label>
          <textarea id="mensagem" name="mensagem" placeholder="Escreva sua mensagem aqui..." required></textarea>
        </div>

        <button type="submit" class="botao-enviar">
          <img src="../assets/icones/enviar_p.png" alt="Ícone de envio">
          Enviar Solicitação
        </button>
      </form>
    </div>
  </div>

  <div id="sucesso-overlay" class="overlay" style="display: none;">
    <div class="sucesso-box">
      <p>Sua solicitação foi enviada com sucesso.<br>
      Aguarde cerca de 3 dias úteis para a possível aprovação.</p>
    </div>
  </div>

  <div id="erro-overlay" class="overlay" style="display: none;">
    <div class="sucesso-box" style="background: #FEE2E2; border: 1px solid #EF4444; color: #991B1B;">
      <p id="erro-msg"></p>
    </div>
  </div>

  <script src="../js/solicitar-demo.js"></script>
</body>
</html>
