spring.application.name=petclean
server.port=8080

# ===================== Datasource (H2 em memoria) =====================
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:petcleandb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# Console web do banco H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# permite embutir o console do H2 em iframe
spring.h2.console.settings.web-allow-others=true

# ===================== JPA / Hibernate =====================
# ddl-auto=create recria o schema e o import.sql popula os dados de demonstracao
spring.jpa.hibernate.ddl-auto=create
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# ===================== Thymeleaf (paginas do painel) =====================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
# garante numeros no padrao brasileiro (R$ 1.234,56)
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# ===================== Sessao (logout / protecao de rotas) =====================
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.name=PETCLEANSESSION

# ===================== Swagger / OpenAPI =====================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# ===================== Log =====================
logging.level.br.com.fatecmaua.petclean=INFO
